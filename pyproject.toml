[project]
name = "data-fetcher"
version = "1.0.5"
description = """\
  Small Python app that fetches posts from a public API (jsonplaceholder) with retries, structured logging, and typed \
  settings.\
  """
readme = "README.md"
license = "MIT"
license-files = [ "LICEN[CS]E.*" ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "hypothesis>=6.156.9",
  "mutmut>=3.6",
  "pip-licenses>=5.5.5",
  "prek>=0.4.10",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=4.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
  "python-semantic-release>=10.6.1",
  "respx>=0.23.1",
  "ruff>=0.15.22",
  "ty>=0.0.61",
  "vulture>=2.16",
]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = 88
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D100",
  "D104",
  "E501",
  "EXE002",
  "G004",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "TC001",
  "TC002",
  "TC003",
]
lint.per-file-ignores."__init__.py" = [ "F401", "F403" ]
lint.per-file-ignores."src/**/main.py" = [
  "BLE001",
  "FBT001",
  "FBT002",
  "PLR0913",
]
lint.per-file-ignores."tests/**" = [ "ANN", "D", "PLR2004", "S101", "SLF001" ]
lint.mccabe.max-complexity = 10
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 8

[tool.vulture]
paths = [ "src", "tests", "vulture_whitelist.py" ]
ignore_names = [ "Meta", "model_config", "test_*" ]
ignore_decorators = [ "@*.getter", "@*.setter", "@pytest.fixture" ]
min_confidence = 60
sort_by_size = true

[tool.ty]
environment.python-version = "3.14"
rules.possibly-missing-import = "error"
rules.unused-ignore-comment = "warn"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = [
  "--numprocesses=auto",
  "--dist=loadscope",
  "--strict-config",
  "--cov=src",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--import-mode=importlib",
  "--cov-fail-under=80",
]
ini_options.xfail_strict = true
ini_options.filterwarnings = [ "ignore::DeprecationWarning:pydantic.*" ]
ini_options.asyncio_mode = "auto"

[tool.semantic_release]
tag_format = "v{version}"
version_toml = [ "pyproject.toml:project.version" ]
build_command = "uv lock && git add uv.lock"
commit_parser = "conventional"
branches.main.match = "^main$"
branches.main.prerelease = false
upload_to_pypi = false
upload_to_vcs_release = true

# LGPL is allowed for python-gitlab, a transitive dev-only dependency of
# python-semantic-release; it is never distributed with the app itself.
[tool.pip-licenses]
partial-match = true
allow-only = "MIT;BSD;Apache;ISC;MPL;PSF;LGPL"

[tool.mutmut]
source_paths = [ "src" ]
pytest_add_cli_args_test_selection = [ "tests" ]
# --no-cov: pytest addopts sets --cov-fail-under=80, which fails mutmut's
# baseline/stats run since a single mutant's test subset never hits 80%.
# -n0: run xdist serially (not `-p no:xdist`, which would leave addopts'
# --numprocesses/--dist as unrecognized args) to avoid double-parallelizing
# on top of mutmut's own worker pool.
pytest_add_cli_args = [ "--no-cov", "-n0" ]
