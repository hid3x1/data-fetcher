name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Installing dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Typecheck (ty)
        run: uv run ty check src

      - name: Test (pytest)
        run: uv run pytest

      - name: Security audit
        run: uv audit

      - name: Dependency check (deptry)
        run: uv run deptry .

      - name: Dead code scan (vulture)
        run: uv run vulture

      - name: License compatibility scanning (pip-licenses)
        run: uv run pip-licenses
