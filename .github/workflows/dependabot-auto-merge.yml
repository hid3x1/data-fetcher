name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: [CI, "Lint PR Title"]
    types: [completed]

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # Execute only if the triggering workflow succeeded on a PR (excluding pushes to main)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Find Dependabot PR
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh api "repos/$REPO/pulls" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\" and .user.login == \"dependabot[bot]\") | .number" \
            | head -1)
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # No branch protection / required status checks on this repo (free plan),
      # so both required workflows are confirmed here instead of relying on
      # `gh pr merge --auto` to wait on GitHub's side.
      - name: Check required workflows succeeded
        id: check-required
        if: steps.find-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ci_state=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.run_started_at) | last | .conclusion // "missing"')
          lint_state=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[] | select(.name == "Lint PR Title")] | sort_by(.run_started_at) | last | .conclusion // "missing"')
          echo "CI: $ci_state, Lint PR Title: $lint_state"
          if [ "$ci_state" = "success" ] && [ "$lint_state" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Dependabot PR
        if: steps.find-pr.outputs.number != '' && steps.check-required.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --repo "$REPO"

      - name: Trigger Release
        if: steps.find-pr.outputs.number != '' && steps.check-required.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main --repo "$REPO"
